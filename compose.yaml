services:
  localstack:
    image: localstack/localstack:2026.10.1
    ports:
      - "127.0.0.1:4566:4566"            # gateway-ul unic pentru toate serviciile AWS emulate
      - "127.0.0.1:4510-4559:4510-4559"  # porturi folosite de unele servicii
    env_file:
      - path: .env.localstack
        required: false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
